name: Backup da roleta e dos logins

# O que este projeto tem de verdade no Supabase: o LOGIN do operador (auth) e a
# linha com o ESTADO da roleta (public.roleta_estado) — lista de experts,
# lápides, configuração, rodada e histórico. Não há mais nada.
#
# Por isso o backup não é um pg_dump: ele lê pela API com a chave service_role,
# junta tudo num JSON, comprime e criptografa com openssl — que já existe no Mac
# do Victor, ao contrário do gpg. Guardado como artefato por 90 dias. Antes daqui, este workflow falhava todo dia por falta de secrets e o
# projeto ficou sem backup nenhum (corrigido em 18/09/2026).
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   SUPABASE_SERVICE_ROLE  → chave service_role do projeto
#   BACKUP_PASSPHRASE      → senha que abre o arquivo (está no cofre local)

on:
  schedule:
    - cron: "0 5 * * *"   # todo dia 05:00 UTC (~02:00 BRT, depois do Corujão)
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPA: https://hovbgrhmoqrhrxvwvkbt.supabase.co

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir os secrets
        env:
          SRV: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SRV"        || { echo "::error::Secret SUPABASE_SERVICE_ROLE ausente"; exit 1; }
          test -n "$PASSPHRASE" || { echo "::error::Secret BACKUP_PASSPHRASE ausente"; exit 1; }

      - name: Baixar estado e logins
        env:
          SRV: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          set -euo pipefail
          curl -sS -f "$SUPA/rest/v1/roleta_estado?select=*" \
            -H "apikey: $SRV" -H "Authorization: Bearer $SRV" > estado.json
          curl -sS -f "$SUPA/auth/v1/admin/users?per_page=200" \
            -H "apikey: $SRV" -H "Authorization: Bearer $SRV" > usuarios.json
          python3 - <<'PY'
          import json, datetime
          estado = json.load(open('estado.json'))
          users  = json.load(open('usuarios.json'))
          lista  = users.get('users', users if isinstance(users, list) else [])
          # e-mail e data bastam para recriar o acesso; nada de hash de senha no artefato.
          enxuto = [{'id':u.get('id'),'email':u.get('email'),
                     'criado':u.get('created_at'),'ultimo_login':u.get('last_sign_in_at')}
                    for u in lista]
          saida = {'quando': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                   'projeto': 'hovbgrhmoqrhrxvwvkbt', 'estado': estado, 'operadores': enxuto}
          json.dump(saida, open('backup.json','w'), ensure_ascii=False, indent=1)
          linha = estado[0] if estado else {}
          print('experts guardados:', len(linha.get('experts') or []))
          print('ja sorteados:', len(linha.get('sorteados') or []))
          print('operadores:', len(enxuto))
          PY
          test -s backup.json

      - name: Recusar backup vazio
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          d = json.load(open('backup.json'))
          e = (d.get('estado') or [{}])[0]
          if not (e.get('experts') or []):
              print("::error::O backup veio sem nenhum expert — melhor falhar do que guardar um arquivo vazio e achar que tem backup")
              sys.exit(1)
          if not d.get('operadores'):
              print("::error::O backup veio sem nenhum operador cadastrado")
              sys.exit(1)
          print("backup com conteudo: ok")
          PY

      - name: Compactar e criptografar
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d-%H%M)
          ARQ="backup-$STAMP.json.gz.enc"
          gzip -9 -c backup.json \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASSPHRASE \
            > "$ARQ"
          # prova de que abre: descriptografa de volta e confere o JSON
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:PASSPHRASE -in "$ARQ" \
            | gunzip | python3 -c "import json,sys; d=json.load(sys.stdin); print('conferido: abre e tem', len(d['estado'][0]['experts']), 'experts')"
          rm -f backup.json estado.json usuarios.json
          ls -lh "$ARQ"

      - uses: actions/upload-artifact@v4
        with:
          name: backup-roleta
          path: backup-*.json.gz.enc
          retention-days: 90
