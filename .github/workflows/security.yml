name: Segurança (SAST · Secrets · Deps)

# SAST (CodeQL), varredura de segredos (Gitleaks) e headers em produção.
# Roda em push/PR na main e semanalmente.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # toda segunda 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # publica alertas na aba Security do repo

jobs:
  codeql:
    name: SAST · CodeQL (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  secrets:
    name: Varredura de segredos · Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  headers:
    name: Headers de segurança em produção
    runs-on: ubuntu-latest
    steps:
      - name: Conferir headers do domínio
        run: |
          set -e
          URL="https://safiriontradingbrasil.com/arsenal-pro/"
          H=$(curl -s -I --max-time 20 --retry 2 "$URL")
          echo "$H"
          # O Cloudflare às vezes desafia os IPs dos runners do GitHub (403 +
          # cf-mitigated: challenge). Nesse caso a resposta é a página de
          # desafio do próprio Cloudflare — não os headers do site — e a
          # checagem fica inconclusiva, não reprovada.
          if echo "$H" | grep -iq "^cf-mitigated: challenge"; then
            echo "::warning::Cloudflare desafiou o runner — headers reais não conferidos nesta execução (inconclusivo, não é falha do site)."
            exit 0
          fi
          for header in "content-security-policy" "strict-transport-security" "x-frame-options" "x-content-type-options" "referrer-policy" "permissions-policy"; do
            echo "$H" | grep -iq "$header" || { echo "::error::Header ausente: $header"; exit 1; }
          done
          echo "Todos os headers de segurança presentes."
